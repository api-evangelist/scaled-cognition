aid: scaled-cognition
name: Scaled Cognition
description: >-
  Scaled Cognition is a Mountain View, California AI model lab and enterprise platform company
  behind APT-1, the Agentic Pretrained Transformer — a frontier model the company says is
  pretrained on action prediction rather than token prediction and purpose-built for enterprise
  customer-experience agents. The commercial surface is an Agent Builder platform (Studio, a Python
  APT SDK, AgentTwin transcript-to-agent conversion, GenAPI simulation, Agent Evaluator, Agent
  Monitor and Agent Defender) exposed to customers through a stateless RESTful API that can run in
  Scaled Cognition's SOC 2 Type II cloud, in a customer VPC, or on-premises. Founded by Dan Roth
  (CEO), Dan Klein (CTO, UC Berkeley) and Damon Pender (CFO), the team previously built Semantic
  Machines, acquired by Microsoft in 2018. Backed by Khosla Ventures with a Genesys partnership.
  No public developer portal, API reference, or machine-readable contract is published — the
  platform API and its OpenAPI live behind the Studio login.
