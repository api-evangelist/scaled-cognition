  state: gated
  reason: customer-only-docs
  detail: >-
    Scaled Cognition's Agent Builder API demonstrably ships an OpenAPI — https://studio.scaledcognition.com/api/openapi.json
    answers 401 {"error":"Not authenticated."} rather than 404 — but every reference path on that host
    307-redirects to /login, docs.scaledcognition.com does not resolve, api.scaledcognition.com 403s
    every anonymous request from an AWS ELB, and the marketing site has no developer section at all,
    so the contract is readable only by an existing tenant.
