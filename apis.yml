apis:
- name: Scaled Cognition APT Agent Platform API
  description: >-
    The stateless RESTful API behind the Scaled Cognition Agent Builder platform, used to author,
    simulate, deploy and monitor APT-1 agents. Scaled Cognition describes the interface publicly as
    an open, vendor-agnostic, stateless REST API with no-code, low-code and Python SDK deployment
    options, but publishes no public reference or machine-readable contract: the platform OpenAPI at
    https://studio.scaledcognition.com/api/openapi.json answers 401 {"error":"Not authenticated."}
    to an anonymous client, and https://api.scaledcognition.com/ answers 403 from an AWS ELB.
  humanURL: https://www.scaledcognition.com/product/explore-platform
